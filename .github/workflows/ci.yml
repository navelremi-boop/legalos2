name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @legal-os/poste typecheck
      - run: pnpm --filter @legal-os/poste lint:ci
      - run: pnpm --filter @legal-os/poste build
      - run: node tests/recette/j0.mjs
      - run: node tests/recette/s8-delais.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.5
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-contracts
      - name: Postgres pour cargo test
        run: docker run -d --name legalos-test-pg -e POSTGRES_PASSWORD=legalos -e POSTGRES_USER=legalos -e POSTGRES_DB=legalos -p 5432:5432 postgres:16.8-bookworm
      - name: Attendre Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec legalos-test-pg pg_isready -U legalos && exit 0
            sleep 2
          done
          exit 1
      - name: Tests workspace
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://legalos:legalos@127.0.0.1:5432/legalos
          LEGALOS_MODE: development
          SECRETS_CHIFFREMENT_KEY: legalos_demo_chiffrement_32oct!!
      - name: SDK PowerSync Tauri (crate hors workspace sqlx)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cargo fmt --manifest-path apps/poste/src-tauri/Cargo.toml -- --check
          cargo check --manifest-path apps/poste/src-tauri/Cargo.toml
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: J4 — pas de WebDriver dans le build distribué
        run: node tests/recette/j4-no-webdriver.mjs

  s1-instance:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.5
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Prepare .env for compose
        run: cp .env.development.example .env
      - name: Migrations sans compte de démonstration
        run: node tests/recette/j2-demo-migration-parity.mjs
      - name: Contrat onboarding J2 (sans sync simulée dans FirstLaunchFlow)
        run: node tests/recette/j2-onboarding-scope.mjs
      - name: Recette S1 (docker compose + probes)
        run: node tests/recette/s1.mjs
      - name: Données de démonstration (hors migrations)
        run: cargo xtask demo
      - name: Recette S2 (auth HTTP, stack déjà up)
        run: node tests/recette/s2.mjs
      - name: Probe PowerSync J3 (JWT post-TOTP via Caddy /sync)
        run: node tests/recette/j3-powersync-liveness.mjs
      - name: Tests intégration auth (Postgres compose)
        run: cargo test -p legalos-api --test auth_integration -- --nocapture

  facturx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: XML CII de référence
        run: cargo test -p legalos-api --lib cii_contient_le_total
      - name: Saxon et Typst
        run: |
          mkdir -p target
          curl -fsSL -o target/Saxon-HE-12.5.jar https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -fsSL -o target/xmlresolver-5.2.2.jar https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.2.2/xmlresolver-5.2.2.jar
          curl -fsSL -o target/typst.tar.xz https://github.com/typst/typst/releases/download/v0.14.0/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf target/typst.tar.xz -C target
          curl -fsSL -o target/verapdf.zip https://software.verapdf.org/releases/1.28/verapdf-greenfield-1.28.2-installer.zip
          unzip -q target/verapdf.zip -d target/verapdf-inst
          sed "s|INSTALL_PATH|$GITHUB_WORKSPACE/target/verapdf|" tests/recette/facturx/verapdf-auto.xml > target/verapdf-auto.xml
          java -jar target/verapdf-inst/verapdf-greenfield-1.28.2/verapdf-izpack-installer-1.28.2.jar target/verapdf-auto.xml
      - name: Schematron, PDF/A-3b, veraPDF
        run: |
          export SAXON_CP="$PWD/target/Saxon-HE-12.5.jar:$PWD/target/xmlresolver-5.2.2.jar"
          export TYPST="$PWD/target/typst-x86_64-unknown-linux-musl/typst"
          export VERAPDF="$PWD/target/verapdf/verapdf"
          node tests/recette/s9-facturx.mjs

  macos-placeholder:
    runs-on: macos-latest
    needs: [frontend, rust, s1-instance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Présence du dépôt (pas un build, pas un lancement, pas une preuve S14b)
        run: echo "Ce job ne construit pas et ne lance pas l'application."
