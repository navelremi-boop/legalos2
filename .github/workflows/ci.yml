name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @legal-os/poste typecheck
      - run: pnpm --filter @legal-os/poste lint:ci
      - run: pnpm --filter @legal-os/poste build
      - run: node tests/recette/j0.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.5
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-contracts
      - name: SDK PowerSync Tauri (crate hors workspace sqlx)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cargo fmt --manifest-path apps/poste/src-tauri/Cargo.toml -- --check
          cargo check --manifest-path apps/poste/src-tauri/Cargo.toml

  s1-instance:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.5
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Prepare .env for compose
        run: cp .env.example .env
      - name: Parité migration démo J2 (004 / TOTP chiffré)
        run: node tests/recette/j2-demo-migration-parity.mjs
      - name: Contrat onboarding J2 (sans sync simulée dans FirstLaunchFlow)
        run: node tests/recette/j2-onboarding-scope.mjs
      - name: Recette S1 (docker compose + probes)
        run: node tests/recette/s1.mjs
      - name: Recette S2 (auth HTTP, stack déjà up)
        run: node tests/recette/s2.mjs
      - name: Probe PowerSync J3 (JWT post-TOTP via Caddy /sync)
        run: node tests/recette/j3-powersync-liveness.mjs
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0
      - name: Install workspace (Playwright + poste build J3)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install chromium --with-deps
      - name: Recette J3 deux postes simulés (PowerSync)
        run: node tests/recette/j3-sync-two-postes.mjs
      - name: Tests intégration auth (Postgres compose)
        run: cargo test -p legalos-api --test auth_integration -- --nocapture

  macos-smoke:
    runs-on: macos-latest
    needs: [frontend, rust, s1-instance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Tauri build (S14b placeholder)
        run: |
          echo "S14b: build macOS ad hoc — à compléter jalon J16 (icônes, signingIdentity -)"
