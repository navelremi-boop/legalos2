# Dovecot de test avec XOAUTH2 : le jeton d'accès est validé par introspection (RFC 7662) auprès du fournisseur
# simulé de la recette (tests/recette/lib/simulateur-oauth.mjs, port 18766 de l'hôte). Le mot de passe statique
# reste accepté pour les clients de contrôle de la recette (dépôt de messages).
base_dir = /tmp/dovecot
listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login xoauth2 oauthbearer
mail_location = maildir:/tmp/mail/%u
first_valid_uid = 100
first_valid_gid = 100
mailbox_list_index = yes

passdb {
  driver = oauth2
  mechanisms = xoauth2 oauthbearer
  args = /etc/dovecot/dovecot-oauth2.conf.ext
}

passdb {
  driver = static
  args = password=MotDePasseCapa123!
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
}

protocol imap {
}
