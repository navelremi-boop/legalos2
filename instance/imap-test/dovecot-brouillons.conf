# Dovecot de test pour le dossier des brouillons (J11) : « Ebauches » porte l'attribut spécial Drafts,
# ce qui prouve que l'attribut annoncé par le serveur l'emporte sur les noms usuels.
base_dir = /tmp/dovecot
listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/tmp/mail/%u
first_valid_uid = 100
first_valid_gid = 100
mailbox_list_index = yes

passdb {
  driver = static
  args = password=MotDePasseCapa123!
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
  mailbox Ebauches {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
}

protocol imap {
}
