# Même serveur que dovecot-actions.conf, sans MOVE (RFC 6851) annoncé : le déplacement passe par COPY,
# puis \Deleted et UID EXPUNGE de l'original seul (UIDPLUS annoncé).
base_dir = /tmp/dovecot
listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/tmp/mail/%u
first_valid_uid = 100
first_valid_gid = 100
mailbox_list_index = yes

passdb {
  driver = static
  args = password=MotDePasseCapa123!
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
  mailbox Poubelle {
    special_use = \Trash
    auto = create
  }
  mailbox Conservation {
    special_use = \Archive
    auto = create
  }
}

protocol imap {
  imap_capability = IMAP4rev1 LITERAL+ SASL-IR ID ENABLE IDLE SORT THREAD=REFERENCES MULTIAPPEND UNSELECT CHILDREN NAMESPACE UIDPLUS LIST-EXTENDED ESEARCH WITHIN BINARY
}
