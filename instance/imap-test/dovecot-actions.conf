# Dovecot de test des actions sur les messages (J11, critère iii) : MOVE et UIDPLUS annoncés, et
# deux dossiers à usage spécial portant des noms que rien ne laisse deviner (« Poubelle »,
# « Conservation »), pour prouver que l'attribut annoncé par le serveur l'emporte sur les noms usuels.
base_dir = /tmp/dovecot
listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/tmp/mail/%u
first_valid_uid = 100
first_valid_gid = 100
mailbox_list_index = yes

passdb {
  driver = static
  args = password=MotDePasseCapa123!
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
  mailbox Poubelle {
    special_use = \Trash
    auto = create
  }
  mailbox Conservation {
    special_use = \Archive
    auto = create
  }
}

protocol imap {
}
