# Dovecot de test de la limite de connexions (J11, consigne de l'architecte du 26/10/2026) : deux connexions
# simultanées au plus par utilisateur et par adresse ; la troisième reçoit
# `NO [UNAVAILABLE] Maximum number of connections from user+IP exceeded`.
base_dir = /tmp/dovecot
listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/tmp/mail/%u
first_valid_uid = 100
first_valid_gid = 100
mailbox_list_index = yes
mail_max_userip_connections = 2

passdb {
  driver = static
  args = password=MotDePasseCapa123!
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
}

protocol imap {
}
