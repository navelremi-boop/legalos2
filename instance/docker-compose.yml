# LEGAL OS — instance cabinet (versions figées, volumes nommés).
# Usage : depuis instance/ — docker compose --env-file ../.env up -d

name: legalos-instance

services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: legalos/caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      powersync:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: instance/Dockerfile.api
    image: legalos/api:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_BIND: 0.0.0.0:8080
      API_RUN_MIGRATIONS: "true"
      SECRETS_CHIFFREMENT_KEY: ${SECRETS_CHIFFREMENT_KEY}
      LEGALOS_MODE: ${LEGALOS_MODE:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-legalos-dev-1}
      JWT_ISSUER: ${JWT_ISSUER:-legalos-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-legalos-powersync}
      JWT_RSA_PRIVATE_KEY_PEM: ${JWT_RSA_PRIVATE_KEY_PEM:-}
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:3900
      S3_REGION: garage
      S3_BUCKET: legalos
      RUST_LOG: info
    env_file:
      - path: ./garage/cles.local
        required: false
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: legalos/postgres:16.8-s1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  powersync:
    image: journeyapps/powersync-service:1.26.1
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgresql://powersync_replication:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PS_STORAGE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/powersync_storage
    volumes:
      - ./powersync/service.yaml:/config/service.yaml:ro
      - ./powersync/sync-rules.yaml:/config/sync-rules.yaml:ro
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/probes/liveness').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:3900:3900"
    expose:
      - "3900"
      - "3901"
      - "3902"
      - "3903"
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  greenmail:
    image: greenmail/standalone:2.1.0
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${GREENMAIL_USER}:${GREENMAIL_PASSWORD}
    expose:
      - "3025"
      - "3110"
      - "3143"
      - "3465"
      - "3993"
      - "3995"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/3025' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  simulateur-pa:
    build:
      context: ./simulateur-pa
      dockerfile: Dockerfile
    image: legalos/simulateur-pa:s1-stub
    restart: unless-stopped
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  garage_meta:
  garage_data:
