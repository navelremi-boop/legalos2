# PowerSync self-hosted — voir docs.powersync.com/configuration/powersync-service/self-hosted-instances

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

# JWT émis par l'API (RS256, GET /auth/jwks) — docs.powersync.com/configuration/auth/custom
client_auth:
  jwks_uri: http://api:8080/auth/jwks
  audience:
    - legalos-powersync

sync_rules:
  path: /config/sync-rules.yaml
