      WHERE intercalaire_elements.visibilite = 'public'
        AND intercalaire_elements.cabinet_id::text = auth.parameter('cabinet_id')

  intercalaire_elements_restreints:
    auto_subscribe: true
    query: |
      SELECT intercalaire_elements.id, intercalaire_elements.intercalaire_id, intercalaire_elements.dossier_id, intercalaire_elements.type_element, intercalaire_elements.element_id, intercalaire_elements.revision, intercalaire_elements.visibilite, intercalaire_elements.restreint, intercalaire_elements.cree_le::text AS cree_le
