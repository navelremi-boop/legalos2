# Sync Streams (edition 3) — frontière de sécurité (S5).
# Auth : auth.user_id() = JWT sub ; auth.parameter('cabinet_id') = claim cabinet_id.
config:
  edition: 3

streams:
  cabinet_global:
    auto_subscribe: true
    queries:
      - SELECT id, slug, nom, totp_obligatoire, reference_modele, reference_remise_a_zero, cree_le::text AS cree_le, revision FROM cabinets WHERE id::text = auth.parameter('cabinet_id')

  journal_cabinet:
    auto_subscribe: true
    query: SELECT id, cabinet_id, dossier_id, table_cible, enregistrement_id, champ, valeur_remplacee, valeur_appliquee, revision_base, revision_appliquee, conflit, cree_le::text AS cree_le FROM journal_modifications WHERE dossier_id IS NULL AND cabinet_id::text = auth.parameter('cabinet_id')

  journal_publics:
    auto_subscribe: true
    query: |
      SELECT journal_modifications.id, journal_modifications.cabinet_id, journal_modifications.dossier_id, journal_modifications.table_cible, journal_modifications.enregistrement_id, journal_modifications.champ, journal_modifications.valeur_remplacee, journal_modifications.valeur_appliquee, journal_modifications.revision_base, journal_modifications.revision_appliquee, journal_modifications.conflit, journal_modifications.cree_le::text AS cree_le
      FROM journal_modifications
      WHERE journal_modifications.visibilite = 'public'
        AND journal_modifications.dossier_id IS NOT NULL
        AND journal_modifications.cabinet_id::text = auth.parameter('cabinet_id')

  journal_restreints:
    auto_subscribe: true
    query: |
      SELECT journal_modifications.id, journal_modifications.cabinet_id, journal_modifications.dossier_id, journal_modifications.table_cible, journal_modifications.enregistrement_id, journal_modifications.champ, journal_modifications.valeur_remplacee, journal_modifications.valeur_appliquee, journal_modifications.revision_base, journal_modifications.revision_appliquee, journal_modifications.conflit, journal_modifications.cree_le::text AS cree_le
      FROM journal_modifications
      INNER JOIN groupe_acces_membres ON journal_modifications.groupe_acces = groupe_acces_membres.groupe_id
      WHERE groupe_acces_membres.utilisateur_texte = auth.user_id()

  dossiers_publics:
    auto_subscribe: true
    query: SELECT id, cabinet_id, nom, chemise, juridiction, numero_rg, type_dossier, etape, reference, restreint, revision, responsable_id, cree_le::text AS cree_le FROM dossiers WHERE visibilite = 'public' AND cabinet_id::text = auth.parameter('cabinet_id')

  dossiers_restreints:
    auto_subscribe: true
    query: |
      SELECT dossiers.id, dossiers.cabinet_id, dossiers.nom, dossiers.chemise, dossiers.juridiction, dossiers.numero_rg, dossiers.type_dossier, dossiers.etape, dossiers.reference, dossiers.restreint, dossiers.revision, dossiers.responsable_id, dossiers.cree_le::text AS cree_le
      FROM dossiers
      INNER JOIN groupe_acces_membres ON dossiers.groupe_acces = groupe_acces_membres.groupe_id
      WHERE groupe_acces_membres.utilisateur_texte = auth.user_id()

  parties_publics:
    auto_subscribe: true
    query: |
      SELECT parties.id, parties.dossier_id, parties.cabinet_id, parties.role, parties.nom, parties.contact_id, parties.revision, parties.cree_le::text AS cree_le
      FROM parties
      WHERE parties.visibilite = 'public' AND parties.cabinet_id::text = auth.parameter('cabinet_id')

  parties_restreints:
    auto_subscribe: true
    query: |
      SELECT parties.id, parties.dossier_id, parties.cabinet_id, parties.role, parties.nom, parties.contact_id, parties.revision, parties.cree_le::text AS cree_le
