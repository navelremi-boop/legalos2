      SELECT brouillons_facture.id, brouillons_facture.cabinet_id, brouillons_facture.dossier_id, brouillons_facture.temps_id, brouillons_facture.numero, brouillons_facture.ht_centimes, brouillons_facture.libelle, brouillons_facture.intervenant_id, brouillons_facture.taux_centimes_heure, brouillons_facture.visibilite, brouillons_facture.revision, brouillons_facture.cree_le::text AS cree_le
      FROM brouillons_facture
      INNER JOIN groupe_acces_membres ON brouillons_facture.groupe_acces = groupe_acces_membres.groupe_id
