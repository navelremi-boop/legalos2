# Audit des dépendances Rust du workspace racine (API, domaine, stockage, xtask).
# Politique et constat : docs/audit-dependances.md.
#   cargo deny --manifest-path Cargo.toml check

[graph]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Exception nominative du 2026-10-20 (consigne de l'architecte : mise à jour, ou exception justifiée et datée).
# `ttf-parser` 0.25.1 est déclaré non maintenu, sans faille connue ; aucune version corrigée n'existe. Il vient de
# `lopdf` 0.42, que `pdf-extract` 0.12.1 (dernière version) impose (`lopdf = "0.42"`) ; `lopdf` 0.45 ne l'utilise plus.
# Il ne sert qu'à l'extraction du texte d'un PDF pour l'indexation. À lever dès qu'un `pdf-extract` accepte
# `lopdf` 0.45 ou plus ; `unused-ignored-advisory = "deny"` fait alors échouer le contrôle. Voir docs/audit-dependances.md.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser non maintenu, sans faille ; imposé par lopdf 0.42 via pdf-extract 0.12.1 (extraction de texte PDF)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
