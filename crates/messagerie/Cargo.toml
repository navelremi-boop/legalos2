[package]
name = "legalos-messagerie"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Moteur mail LEGAL OS : IMAP derrière FournisseurMail"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
legalos-domaine = { path = "../domaine" }
imap-codec = "=2.0.0-alpha.8"
io-imap = "=0.6.1"
io-sasl = "0.1.0"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "aws-lc-rs", "webpki-roots"] }
icalendar = "=0.17.14"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
mail-parser = "=0.11.9"
ammonia = "=4.2.4"
pimalaya-stream = "0.3.0"
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5.8"

[dev-dependencies]
tokio = { workspace = true }
