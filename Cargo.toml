[workspace]
resolver = "2"
members = [
    "crates/domaine",
    "crates/stockage",
    "crates/api",
    "xtask",
]
default-members = ["crates/api"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
argon2 = { version = "0.6.0", features = ["password-hash", "rand_core"] }
password-hash = "0.6.1"
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
totp-rs = { version = "6.0.0", features = ["std", "otpauth"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.8.5"
rsa = { version = "0.9.8", features = ["pem"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8.9"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors"] }
sqlx = { version = "0.8.5", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui = { version = "9.0.1", features = ["axum"] }
anyhow = "1.0.98"
