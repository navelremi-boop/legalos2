# Audit des dépendances Rust du poste, sur les plateformes livrées (Windows, macOS).
# Politique et constat : docs/audit-dependances.md.
#   cargo deny --manifest-path apps/poste/src-tauri/Cargo.toml --config apps/poste/src-tauri/deny.toml check

[graph]
all-features = false
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std via tauri-plugin-powersync 0.0.6 (commands.rs:5). https://github.com/powersync-ja/powersync-js/issues/1129" },
    { id = "RUSTSEC-2021-0060", reason = "aes-soft via tauri-plugin-powersync 0.0.6 (commands.rs:5). https://github.com/powersync-ja/powersync-js/issues/1129" },
    { id = "RUSTSEC-2021-0064", reason = "cpuid-bool via tauri-plugin-powersync 0.0.6 (commands.rs:5). https://github.com/powersync-ja/powersync-js/issues/1129" },
    { id = "RUSTSEC-2026-0174", reason = "http-types via tauri-plugin-powersync 0.0.6 (commands.rs:5). https://github.com/powersync-ja/powersync-js/issues/1129" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
