# Audit des dépendances Rust du poste, sur les plateformes livrées (Windows, macOS).
# Politique et constat : docs/audit-dependances.md.
#   cargo deny --manifest-path apps/poste/src-tauri/Cargo.toml --config apps/poste/src-tauri/deny.toml check

[graph]
all-features = false
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Exception nominative du 2026-11-12 (consigne de l'architecte, B25). `libsqlite3-sys` 0.37 (SQLite embarqué avant
# 3.54.0) est imposé par `rusqlite` 0.39, que `powersync` 0.1.1 et 0.2.0 exigent ; seul `libsqlite3-sys` 0.39
# (`rusqlite` 0.41) est corrigé. Le poste n'ouvre que sa propre base locale, créée par lui dans son dossier de
# données (`apps/poste/src/sync/cheminBaseLocale.ts`, test `cheminBaseLocale.test.ts`). À lever dès qu'une version de
# `powersync` et de `tauri-plugin-powersync` accepte `rusqlite` 0.41 ou plus et date d'au moins quatorze jours ;
# `unused-ignored-advisory = "deny"` fait alors échouer le contrôle. Voir docs/audit-dependances.md.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37 imposé par rusqlite 0.39 via powersync 0.1.1 ; le poste n'ouvre que sa propre base, créée par lui dans son dossier de données ; l'avis ne vise que l'ouverture d'une base et de son -wal écrits par un tiers" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
