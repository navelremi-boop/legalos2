[package]
name = "legal-os-poste"
version = "0.1.0"
description = "LEGAL OS — application de poste (Tauri)"
authors = ["LEGAL OS"]
edition = "2021"

[lib]
name = "legal_os_poste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-powersync = "0.0.6"
keyring = "3.6.3"
powersync = "0.0.7"
async-trait = "0.1"
futures-lite = "2"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# WebDriver embarqué : réservé aux builds de test CI (§ 22-tauri), absent des builds distribués.
test-webdriver = []

[workspace]

[patch.crates-io]
time-macros = { path = "patches/time-macros" }
time-macros-impl = { path = "patches/time-macros-impl" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
