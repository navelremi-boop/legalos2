[package]
name = "legal-os-poste"
version = "0.1.0"
description = "LEGAL OS — application de poste (Tauri)"
authors = ["LEGAL OS"]
edition = "2021"
publish = false

[lib]
name = "legal_os_poste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.5.0"
tauri-plugin-powersync = "0.0.6"
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
powersync = "0.0.7"
notify = "8.2.0"
rusqlite = { version = "0.39", default-features = false, features = ["load_extension"] }
async-trait = "0.1"
futures-lite = "2"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# WebDriver embarqué : réservé aux builds de test, absent du build distribué.
test-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[workspace]

[patch.crates-io]
time-macros = { path = "patches/time-macros" }
time-macros-impl = { path = "patches/time-macros-impl" }
tauri-plugin-wdio-webdriver = { path = "patches/tauri-plugin-wdio-webdriver" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
